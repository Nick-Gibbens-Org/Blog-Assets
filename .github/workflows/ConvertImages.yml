name: Convert Images to WebP and AVIF

on:
  push:
    branches:
      - main
    paths:
      - images/**.jpg
      - images/**.jpeg
      - images/**.png
      - images/**.webp

permissions:
  contents: write
  pull-requests: write

jobs:
  convert-images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install image conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libavif-bin

      - name: Convert source .webp images to .avif
        run: |
          find images -iname "*.webp" | while read img; do
            base="${img%.*}"
            # Skip .webp files generated from a sibling raster; those are handled below.
            if [ -f "$base.jpg" ] || [ -f "$base.jpeg" ] || [ -f "$base.png" ]; then
              continue
            fi
            # avifenc cannot read .webp, so decode to a temporary PNG first.
            tmp="$(mktemp --suffix=.png)"
            dwebp "$img" -o "$tmp"
            avifenc --min 25 --max 35 "$tmp" "$base.avif"
            rm -f "$tmp"
          done

      - name: Convert images to .webp and .avif
        run: |
          find images \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read img; do
            cwebp -q 75 "$img" -o "${img%.*}.webp"
            avifenc --min 25 --max 35 "$img" "${img%.*}.avif"
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "Auto-generate WebP and AVIF images"
          title: "Auto-convert images to WebP/AVIF"
          body: "Automatically generated optimized image formats"
          branch: auto-convert-images
